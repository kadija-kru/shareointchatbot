services:
  ollama:
    image: ollama/ollama:latest
    container_name: sharepoint_chatbot_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharepoint_chatbot_app
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8501}:8501"
    env_file:
      - .env
    volumes:
      - index_data:/app/.index
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
  index_data:
    driver: local
